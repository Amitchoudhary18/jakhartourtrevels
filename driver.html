<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Driver Live Portal</title>
<style>
body { font-family: Arial, sans-serif; background: #eef2f5; padding: 20px; }
.panel { background: #fff; padding: 20px; border-radius: 10px; max-width: 600px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
input { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing:border-box;}
button { width: 100%; padding: 12px; background: #0f8a62; color:#fff; border:none; border-radius:5px; cursor:pointer;}
.job-card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
</style>
</head>
<body>

<div class="panel" id="authPanel">
    <h2>Driver App</h2>
    <input type="text" id="regName" placeholder="Full Name">
    <input type="tel" id="regMobile" placeholder="Mobile Number">
    <button onclick="window.register()">Register & Enter</button>
</div>

<div class="panel" id="dashboard" style="display:none;">
    <h2>Live Jobs</h2>
    <button onclick="window.toggleDuty()" id="dutyBtn" style="background:#e74c3c; margin-bottom:20px;">Go ON DUTY</button>
    <div id="jobList"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, updateDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBHqSJW6RJkKDrUtPfRmgqQMYei58wBSks",
    authDomain: "jakhar-tour-travels.firebaseapp.com",
    projectId: "jakhar-tour-travels",
    storageBucket: "jakhar-tour-travels.firebasestorage.app",
    messagingSenderId: "295813687761",
    appId: "1:295813687761:web:ff425781db24587a8298f0"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let currentDriver = null;

  window.register = async function() {
      const name = document.getElementById('regName').value;
      const mobile = document.getElementById('regMobile').value;
      if(!name || !mobile) return alert("Fill details!");
      
      const newId = "JTT-D-" + Math.floor(1000 + Math.random() * 9000);
      currentDriver = { id: newId, name, mobile, onDuty: false };
      
      // Save Driver to Firebase
      await setDoc(doc(db, "drivers", newId), currentDriver);
      
      document.getElementById('authPanel').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      listenToJobs();
  }

  window.toggleDuty = async function() {
      currentDriver.onDuty = !currentDriver.onDuty;
      await updateDoc(doc(db, "drivers", currentDriver.id), { onDuty: currentDriver.onDuty });
      
      const btn = document.getElementById('dutyBtn');
      if(currentDriver.onDuty) {
          btn.innerText = "You are ON DUTY (Click to turn OFF)";
          btn.style.background = "#27ae60";
      } else {
          btn.innerText = "Go ON DUTY";
          btn.style.background = "#e74c3c";
      }
  }

  function listenToJobs() {
      onSnapshot(collection(db, "bookings"), (snapshot) => {
          let html = '';
          snapshot.forEach((d) => {
              let b = d.data();
              if(b.status === 'Pending' || b.driverId === currentDriver.id) {
                  html += `<div class="job-card">
                      <h3>${b.route}</h3>
                      <p><b>Status:</b> ${b.status} | <b>Fare:</b> ${b.fare}</p>
                      ${b.status === 'Pending' ? `<button onclick="window.acceptJob('${b.id}')">Accept Booking</button>` : `<strong style="color:#0f8a62;">✓ Assigned to You</strong>`}
                  </div>`;
              }
          });
          document.getElementById('jobList').innerHTML = html || "<p>No jobs right now...</p>";
      });
  }

  window.acceptJob = async function(id) {
      if(!currentDriver.onDuty) return alert("Please go ON DUTY first!");
      await updateDoc(doc(db, "bookings", id), { 
          status: 'Confirmed', 
          driverId: currentDriver.id, 
          driverName: currentDriver.name 
      });
      alert("Job Accepted on Live Network!");
  }
</script>
</body>
</html>
