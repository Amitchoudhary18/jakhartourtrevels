<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Driver Portal | Jakhar Travels</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
* { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
body { margin: 0; background: #eef2f5; color: #142033; padding: 20px; }
nav { display: flex; justify-content: space-between; align-items:center; background: #0f8a62; color: #fff; padding: 15px 30px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(15,138,98,0.3);}
nav a { color: #fff; text-decoration: none; font-weight: bold; background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 8px;}

.panel { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 600px; margin: auto; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.form-grid label { font-size: 13px; font-weight: bold; color: #555; }
.full-width { grid-column: 1 / -1; }
input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; margin-top: 5px; outline: none; }
input:focus, select:focus { border-color: #0f8a62; }
button { width: 100%; padding: 14px; border-radius: 8px; border: none; background: #0f8a62; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.3s;}
button:hover { background: #0b6b4c; }

.tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
.tab-btn { flex: 1; background: #f0f0f0; color: #333; }
.tab-btn.active { background: #0f8a62; color: #fff; }

.job-card { border: 1px solid #e0e0e0; padding: 20px; border-radius: 12px; margin-bottom: 15px; background: #fafafa; border-left: 5px solid #0f8a62;}
.badge { background: #fff3cd; color: #856404; padding: 5px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; }

/* Duty Toggle Switch UI */
.duty-card { background: #f8f9fa; border: 2px solid #e2e8f0; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
.duty-status { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
.duty-on { color: #27ae60; }
.duty-off { color: #e74c3c; }
.toggle-btn { padding: 12px 20px; border-radius: 30px; font-size: 16px; margin: 0 5px; width: auto;}
.btn-on { background: #27ae60; }
.btn-off { background: #e74c3c; }
.loc-btn { background: #0b74c9; margin-top: 15px; }

/* ===== COLORFUL DRIVER THEME ===== */
body{background:linear-gradient(135deg,#eafaf5 0%,#eef6ff 48%,#fff3e8 100%);min-height:100vh}
nav{background:linear-gradient(135deg,#075e54,#0f8a62 50%,#0b74c9);box-shadow:0 10px 28px rgba(15,138,98,.25)}
.panel{background:rgba(255,255,255,.94);border:1px solid rgba(15,138,98,.10);box-shadow:0 16px 40px rgba(30,70,60,.10)}
button{background:linear-gradient(135deg,#0f8a62,#0b74c9);box-shadow:0 6px 15px rgba(15,138,98,.15)}
button:hover{background:linear-gradient(135deg,#0b6b4c,#085a9c)}
.tab-btn.active{background:linear-gradient(135deg,#0f8a62,#0b74c9);box-shadow:0 7px 18px rgba(15,138,98,.2)}
.job-card{background:linear-gradient(145deg,#fff,#f1fbf8);border-left-color:#0f8a62;box-shadow:0 8px 22px rgba(15,138,98,.06)}

/* ===== DRIVER MOBILE RESPONSIVE ===== */
@media(max-width:700px){
  body{padding:0!important;min-height:100vh}
  nav{margin:0 0 12px!important;border-radius:0!important;padding:12px 14px!important;gap:10px}
  nav>div:first-child{font-size:18px!important}
  nav>div:last-child a{padding:8px 10px!important;font-size:12px}
  .panel{width:calc(100% - 20px)!important;max-width:none!important;margin:10px auto!important;padding:18px!important;border-radius:16px!important}
  .form-grid{grid-template-columns:1fr!important;gap:12px}
  .full-width{grid-column:auto!important}
  .tab-buttons{gap:7px}
  .tab-btn{font-size:14px!important;padding:12px!important}
  .duty-card{padding:16px 12px!important}
  .duty-status{font-size:20px!important}
  .toggle-btn{width:100%!important;margin:5px 0!important;padding:13px 10px!important}
  .loc-btn{width:100%!important;margin-top:10px!important}
  #dashboard>div:first-child{gap:10px;align-items:flex-start!important}
  #dashboard>div:first-child h2{font-size:18px!important;line-height:1.3}
  #dashboard>div:first-child button{font-size:12px!important;white-space:nowrap}
  .job-card{padding:15px!important}
  .job-card h3{font-size:16px!important}
  .job-card p{font-size:13px!important;overflow-wrap:anywhere}
  .job-card button{font-size:14px!important}
}
@media(min-width:701px){body{min-height:100vh}}
/* Duty feedback */
.duty-card.duty-active{border-color:#27ae60;box-shadow:0 0 0 4px rgba(39,174,96,.10),0 14px 35px rgba(39,174,96,.16);animation:dutyPulse 2s ease-in-out infinite}
@keyframes dutyPulse{50%{transform:translateY(-2px)}}
.duty-popup{position:fixed;left:50%;top:82px;transform:translateX(-50%) translateY(-15px);z-index:50000;opacity:0;pointer-events:none;background:linear-gradient(135deg,#075e54,#0f8a62);color:#fff;padding:13px 20px;border-radius:14px;box-shadow:0 12px 35px rgba(0,0,0,.25);font-weight:800;font-size:15px;transition:.28s ease;white-space:nowrap}
.duty-popup.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:500px){.duty-popup{top:72px;max-width:90vw;text-align:center;white-space:normal}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="dutyPopup" class="duty-popup" role="status" aria-live="polite"></div>

<nav>
    <div style="font-size:22px; font-weight:bold;"><i class="fa-solid fa-steering-wheel"></i> Driver Portal</div>
    <div><a href="index.html">← Main Website</a></div>
</nav>

<div class="panel" id="authPanel">
    <div class="tab-buttons">
        <button class="tab-btn active" id="btnLog" onclick="showTab('login')">Login</button>
        <button class="tab-btn" id="btnReg" onclick="showTab('register')">Register New</button>
    </div>

    <div id="loginForm">
        <h2>Driver Login</h2>
        <label>Driver ID</label><input type="text" id="loginId" placeholder="e.g. JTT-D-1001">
        <label>4-Digit PIN</label><input type="password" id="loginPin" placeholder="Enter PIN" maxlength="4">
        <button onclick="loginDriver()">Login securely</button>
    </div>

    <div id="registerForm" style="display:none;">
        <h2>Driver Registration</h2>
        <div class="form-grid">
            <div><label>Full Name</label><input type="text" id="regName"></div>
            <div><label>Mobile Number</label><input type="tel" id="regMobile" maxlength="10"></div>
            <div><label>Vehicle Number</label><input type="text" id="regVehNo"></div>
            <div>
                <label>Vehicle Type</label>
                <select id="regVehType">
                    <option>Maruti Swift</option><option>Maruti Dzire</option><option>Toyota Etios</option>
                    <option>Maruti Ertiga</option><option>Toyota Innova</option>
                </select>
            </div>
            <div class="full-width"><label>Create 4-Digit Login PIN</label><input type="password" id="regPin" maxlength="4"></div>
        </div>
        <button onclick="registerDriver()">Submit Registration</button>
    </div>
</div>

<div class="panel" id="dashboard" style="display:none; max-width: 800px;">
    <div style="display: flex; justify-content: space-between; align-items:center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px;">
        <h2 style="margin:0;"><i class="fa-solid fa-id-badge"></i> <span id="drvNameDisplay">Driver</span></h2>
        <button onclick="logout()" style="width: auto; padding: 8px 15px; background: #e74c3c; margin:0;"><i class="fa-solid fa-power-off"></i> Logout</button>
    </div>
    
    <!-- DUTY & LOCATION CONTROLS -->
    <div class="duty-card">
        <div class="duty-status" id="dutyText">Status: <span class="duty-off">🔴 OFF DUTY</span></div>
        <p style="color:#666; font-size:14px; margin-bottom:15px;">Turn ON duty and share location so Admin can assign rides to you.</p>
        <div>
            <button class="toggle-btn btn-on" onclick="setDuty(true)"><i class="fa-solid fa-play"></i> Go ON Duty</button>
            <button class="toggle-btn btn-off" onclick="setDuty(false)"><i class="fa-solid fa-stop"></i> Go OFF Duty</button>
        </div>
        <button class="loc-btn" onclick="shareLocation()"><i class="fa-solid fa-location-crosshairs"></i> Update Live Location to Admin</button>
        <div id="locStatus" style="margin-top:10px; font-size:13px; color:#0b74c9; font-weight:bold;"></div>
    </div>
    
    <h2><i class="fa-solid fa-list-check"></i> Available & My Jobs</h2>
    <div id="jobList"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBHqSJW6RJkKDrUtPfRmgqQMYei58wBSks",
  authDomain: "jakhar-tour-travels.firebaseapp.com",
  projectId: "jakhar-tour-travels",
  storageBucket: "jakhar-tour-travels.firebasestorage.app",
  messagingSenderId: "295813687761",
  appId: "1:295813687761:web:ff425781db24587a8298f0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentDriver = null;
let jobsUnsub = null;
let driverUnsub = null;

function showTab(tab) {
    document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    document.getElementById('btnLog').classList.toggle('active', tab === 'login');
    document.getElementById('btnReg').classList.toggle('active', tab === 'register');
}

async function registerDriver() {
    const name=document.getElementById('regName').value.trim();
    const mobile=document.getElementById('regMobile').value.trim();
    const pin=document.getElementById('regPin').value.trim();
    const vehicleNo=document.getElementById('regVehNo').value.trim();
    const vehicleType=document.getElementById('regVehType').value;
    if(!name || mobile.length<10 || pin.length!==4) return alert("Fill Name, valid Mobile and 4-digit PIN!");
    try {
        const snap=await db.collection('drivers').orderBy('createdAt','desc').limit(1).get();
        let n=1001;
        if(!snap.empty) {
            const last=snap.docs[0].data().id||'';
            const m=last.match(/(\d+)$/); if(m) n=parseInt(m[1])+1;
        }
        const newId="JTT-D-"+n;
        const existing=await db.collection('drivers').where('id','==',newId).limit(1).get();
        if(!existing.empty) return alert("Driver ID already exists. Please try again.");
        await db.collection('drivers').doc(newId).set({
            id:newId,name,mobile,pin,vehicleNo,vehicleType,onDuty:false,
            lat:null,lng:null,lastLocationTime:'',createdAt:Date.now()
        });
        alert(`Registration Successful!\nYour Driver ID is: ${newId}\nPlease Login now.`);
        document.getElementById('loginId').value=newId;
        showTab('login');
    } catch(e) {
        console.error(e); alert("Firebase error while registering. Check Firestore Rules.");
    }
}

async function loginDriver() {
    const id=document.getElementById('loginId').value.trim().toUpperCase();
    const pin=document.getElementById('loginPin').value.trim();
    try {
        const snap=await db.collection('drivers').doc(id).get();
        if(!snap.exists) return alert("Invalid Driver ID or PIN");
        const d=snap.data();
        if(d.pin!==pin) return alert("Invalid Driver ID or PIN");
        currentDriver=d;
        document.getElementById('authPanel').style.display='none';
        document.getElementById('dashboard').style.display='block';
        document.getElementById('drvNameDisplay').innerText=d.name;
        updateDutyUI();
        subscribeDriver();
        loadJobs();
    } catch(e) { console.error(e); alert("Firebase login error. Check Firestore Rules."); }
}

function subscribeDriver() {
    if(driverUnsub) driverUnsub();
    driverUnsub=db.collection('drivers').doc(currentDriver.id).onSnapshot(doc=>{
        if(doc.exists) { currentDriver={...currentDriver,...doc.data()}; updateDutyUI(); }
    });
}

async function setDuty(status) {
    if(!currentDriver) return;
    try {
      await db.collection('drivers').doc(currentDriver.id).update({onDuty:status});
      currentDriver.onDuty=status; updateDutyUI();
      if(status){
        showDutyPopup('🟢 DUTY ON — गाड़ी स्टार्ट हो गई है');
        playEngineStartSound();
        startLiveLocation();
      } else {
        stopLiveLocation();
        document.getElementById('locStatus').innerText='🔴 Live location sharing stopped.';
        showDutyPopup('🔴 DUTY OFF — आज की ड्यूटी बंद');
        playDutyOffSound();
      }
    } catch(e){ console.error(e); alert("Could not update duty status."); }
}

function showDutyPopup(message){
  const p=document.getElementById('dutyPopup'); if(!p)return;
  p.textContent=message; p.classList.add('show');
  clearTimeout(window.dutyPopupTimer); window.dutyPopupTimer=setTimeout(()=>p.classList.remove('show'),2600);
}

// Browser-safe sounds: the ON/OFF button is a user gesture, so mobile browsers allow playback.
function getAudioContext(){
  const C=window.AudioContext||window.webkitAudioContext; if(!C)return null;
  if(!window.jttAudio)window.jttAudio=new C();
  if(window.jttAudio.state==='suspended')window.jttAudio.resume();
  return window.jttAudio;
}
function tone(ctx,freq,start,duration,gain,type='sine'){
  const o=ctx.createOscillator(),g=ctx.createGain(); o.type=type;o.frequency.setValueAtTime(freq,start);
  g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(gain,start+.02);g.gain.exponentialRampToValueAtTime(.0001,start+duration);
  o.connect(g);g.connect(ctx.destination);o.start(start);o.stop(start+duration+.03);
}
function playEngineStartSound(){
  const c=getAudioContext(); if(!c)return; const t=c.currentTime;
  // Short engine-crank → ignition → idle style sequence
  tone(c,72,t,.22,.13,'sawtooth'); tone(c,92,t+.16,.20,.11,'sawtooth'); tone(c,118,t+.34,.16,.10,'sawtooth');
  tone(c,180,t+.50,.70,.055,'sine');
}
function playDutyOffSound(){
  const c=getAudioContext(); if(!c)return; const t=c.currentTime;
  tone(c,520,t,.14,.07,'sine'); tone(c,360,t+.13,.22,.06,'sine');
}
function playNewBookingSound(){
  const c=getAudioContext(); if(!c)return; const t=c.currentTime;
  tone(c,880,t,.13,.09,'sine'); tone(c,1175,t+.14,.16,.10,'sine'); tone(c,880,t+.32,.22,.08,'sine');
}

function updateDutyUI() {
    const dt=document.getElementById('dutyText');
    const card=dt.closest('.duty-card');
    const on=!!(currentDriver && currentDriver.onDuty);
    dt.innerHTML=on?`Status: <span class="duty-on">🟢 ON DUTY • ACTIVE</span>`:`Status: <span class="duty-off">🔴 OFF DUTY</span>`;
    if(card)card.classList.toggle('duty-active',on);
}

let locationWatchId=null;
let locationUpdateBusy=false;
function stopLiveLocation(){if(locationWatchId!==null&&navigator.geolocation){navigator.geolocation.clearWatch(locationWatchId);locationWatchId=null;}}
function startLiveLocation(){if(!currentDriver||!currentDriver.onDuty)return;if(!navigator.geolocation){document.getElementById('locStatus').innerText='❌ Geolocation not supported by this browser.';return;}stopLiveLocation();document.getElementById('locStatus').innerText='📍 Live location sharing active...';locationWatchId=navigator.geolocation.watchPosition(async pos=>{if(!currentDriver||!currentDriver.onDuty||locationUpdateBusy)return;locationUpdateBusy=true;const data={lat:pos.coords.latitude,lng:pos.coords.longitude,lastLocationTime:new Date().toLocaleTimeString()+', '+new Date().toLocaleDateString()};try{await db.collection('drivers').doc(currentDriver.id).update(data);Object.assign(currentDriver,data);document.getElementById('locStatus').innerText='🟢 Live location sharing • Updated just now';}catch(e){console.error(e);document.getElementById('locStatus').innerText='⚠️ Location update failed. Retrying...';}finally{locationUpdateBusy=false;}},()=>document.getElementById('locStatus').innerText='❌ Please allow location access in your browser.',{enableHighAccuracy:true,maximumAge:10000,timeout:15000});}
function shareLocation(){if(!currentDriver||!currentDriver.onDuty)return alert('Please Go ON Duty first to share location.');startLiveLocation();}

function loadJobs() {
    if(jobsUnsub) jobsUnsub();
    let firstSnapshot=true;
    jobsUnsub=db.collection('bookings').onSnapshot(snap=>{
        const jobs=[]; let newPending=false;
        snap.docChanges().forEach(ch=>{ if(ch.type==='added' && ch.doc.data().status==='Pending') newPending=true; });
        snap.forEach(doc=>{ const b=doc.data(); if(b.status==='Pending' || b.driverId===currentDriver.id) jobs.push(b); });
        jobs.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
        renderJobs(jobs);
        if(!firstSnapshot && newPending && currentDriver && currentDriver.onDuty){
          showDutyPopup('🔔 नई booking मिली — तुरंत देखें');
          playNewBookingSound();
          if(navigator.vibrate) navigator.vibrate([180,80,180]);
        }
        firstSnapshot=false;
    },err=>{ console.error(err); document.getElementById('jobList').innerHTML="<div style='color:red;padding:20px;'>Unable to load Firebase bookings.</div>"; });
}

function renderJobs(myJobs) {
    if(myJobs.length===0) {
        document.getElementById('jobList').innerHTML="<div style='text-align:center;padding:30px;color:#777;'>No jobs right now. Stay ON Duty to receive bookings.</div>";
        return;
    }
    let html='';
    myJobs.forEach(b=>{
        const isMine=b.driverId===currentDriver.id;
        html+=`<div class="job-card">
          <div style="display:flex;justify-content:space-between;margin-bottom:10px;"><h3 style="margin:0;color:#0f8a62;">${b.route}</h3><span class="badge">${b.status}</span></div>
          <p style="margin:5px 0;"><b>Customer:</b> ${b.name} (${b.phone})</p>
          <p style="margin:5px 0;"><b>Date & Time:</b> ${b.date} at ${b.time}</p>
          <p style="margin:5px 0;"><b>Requested Car:</b> ${b.car}</p>
          <p style="margin:5px 0;"><b>Total Fare:</b> <span style="font-size:18px;font-weight:bold;color:#27ae60;">${b.fare}</span> (${b.payment})</p>
          ${!isMine && b.status==='Pending' ? `<button onclick="acceptJob('${b.id}')" style="margin-top:10px;"><i class="fa-solid fa-check"></i> Accept This Booking</button>` : `<div style="margin-top:10px;background:#e8f8f5;padding:10px;border-radius:8px;color:#0f8a62;font-weight:bold;">✓ This job is assigned to you.</div>`}
        </div>`;
    });
    document.getElementById('jobList').innerHTML=html;
}

async function acceptJob(id) {
    if(!currentDriver.onDuty) return alert("You must be ON DUTY to accept jobs!");
    try {
        const ref=db.collection('bookings').doc(id);
        const snap=await ref.get();
        if(!snap.exists) return alert("Booking no longer exists.");
        const b=snap.data();
        if(b.status!=='Pending' || b.driverId) return alert("This booking has already been assigned.");
        await ref.update({driverId:currentDriver.id,driverName:currentDriver.name,status:'Confirmed'});
        alert("Job Accepted! Drive safely.");
    } catch(e) { console.error(e); alert("Could not accept booking. Please try again."); }
}

function logout() {
    if(currentDriver && currentDriver.onDuty) {
        if(!confirm("You are currently ON DUTY. Do you want to go OFF DUTY and logout?")) return;
        stopLiveLocation(); db.collection('drivers').doc(currentDriver.id).update({onDuty:false});
    }
    if(jobsUnsub) jobsUnsub();
    if(driverUnsub) driverUnsub();
    currentDriver=null;
    document.getElementById('authPanel').style.display='block';
    document.getElementById('dashboard').style.display='none';
}
</script>
</body>
</html>
